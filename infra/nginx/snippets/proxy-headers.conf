# Shared upstream headers. Included by every location so per-location headers never
# silently drop the inherited set (nginx replaces, rather than merges, proxy_set_header).
proxy_http_version 1.1;
proxy_set_header Host $http_host;
# Nginx is the public edge: the client address is the connection's, and a client-supplied
# X-Forwarded-For is replaced, never extended, so nobody can choose the address the API uses
# for rate limits and audit records. Behind a trusted load balancer, enable the realip module
# instead (set_real_ip_from <LB range>; real_ip_header X-Forwarded-For; real_ip_recursive on;),
# which makes $remote_addr the verified client address before these headers are set.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Request-ID $request_id;
