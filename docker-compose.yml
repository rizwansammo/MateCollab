# MateCollab service stack.
#
# Always combined with docker-compose.dev.yml for local work:
#   pnpm dev          infrastructure + Nginx in Docker; API, worker and web run natively with hot reload
# Optional profiles: "scan" (ClamAV) and "observability" (Grafana LGTM).
# Secrets come from .env (generated by `pnpm run setup`); nothing secret is written here.
# Images are pinned by digest; update tag and digest together.

name: matecollab

x-healthcheck: &default-healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 5s

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MC_PG_SUPERUSER_PASSWORD:?run pnpm run setup first}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
    networks: [data]

  valkey:
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$MC_REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      MC_REDIS_PASSWORD: ${MC_REDIS_PASSWORD:?run pnpm run setup first}
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$MC_REDIS_PASSWORD\" ping | grep -q PONG"]
    networks: [data]

  minio:
    # Built locally from the final MinIO community source release (see the Dockerfile).
    image: matecollab/minio-local:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./infra/docker
      dockerfile: minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MC_MINIO_ROOT_USER:?run pnpm run setup first}
      MINIO_ROOT_PASSWORD: ${MC_MINIO_ROOT_PASSWORD:?run pnpm run setup first}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MC_PUBLIC_URL:-http://localhost:8080}
      MINIO_BROWSER_REDIRECT: "off"
    volumes:
      - miniodata:/data
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
    networks: [data]

  livekit:
    image: livekit/livekit-server:v1.13.9@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${MC_LIVEKIT_API_KEY:?run pnpm run setup first}: ${MC_LIVEKIT_API_SECRET:?run pnpm run setup first}"
    volumes:
      - ./infra/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    networks: [data]

  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "2000"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "/mailpit", "readyz"]
    networks: [data]

  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    environment:
      MC_NGINX_WEB_UPSTREAM: ${MC_NGINX_WEB_UPSTREAM:-web:3000}
      MC_NGINX_API_UPSTREAM: ${MC_NGINX_API_UPSTREAM:-api:8081}
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
    networks: [edge, app]

  # ---- optional ---------------------------------------------------------------------------

  clamav:
    profiles: [scan]
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    networks: [data]

  otel-lgtm:
    profiles: [observability]
    image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    networks: [data]

networks:
  edge: {}
  app: {}
  data: {}

volumes:
  pgdata: {}
  miniodata: {}
