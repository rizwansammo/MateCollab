put:
  operationId: changePassword
  summary: Change the password
  description: Requires a recent password check (`403 reauthentication_required`).
  tags:
  - auth
  security:
  - session: []
    csrf: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ChangePasswordRequest.yaml
  responses:
    '200':
      description: Changed; other sessions are revoked and this browser gets a new session.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LoginResponse.yaml
    4XX:
      $ref: ../components/responses/Problem.yaml
    5XX:
      $ref: ../components/responses/Problem.yaml
