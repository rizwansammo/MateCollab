post:
  operationId: resetPassword
  summary: Set a new password with a reset or setup link
  description: Tokens are single use and expire (reset 60 minutes, account setup 72 hours). An invalid, used or
    expired token answers `422` with a `token` field error.
  tags:
  - auth
  security:
  - webClient: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ResetPasswordRequest.yaml
  responses:
    '204':
      description: Password set; every session of the account is revoked.
    4XX:
      $ref: ../components/responses/Problem.yaml
    5XX:
      $ref: ../components/responses/Problem.yaml
