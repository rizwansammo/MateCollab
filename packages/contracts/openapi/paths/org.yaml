parameters:
  - $ref: ../components/parameters/OrgId.yaml
get:
  operationId: getOrganisation
  summary: Get the organisation profile
  tags: [organisations]
  security:
    - session: []
  responses:
    '200':
      description: The organisation.
      headers:
        ETag:
          description: Profile version; send it back in `If-Match` when updating.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Organisation.yaml
    4XX:
      $ref: ../components/responses/Problem.yaml
    5XX:
      $ref: ../components/responses/Problem.yaml
patch:
  operationId: updateOrganisation
  summary: Update the organisation profile (Admin → General)
  description: |
    Requires `org.settings.manage`. With `If-Match` (the `ETag` of the version being changed) a
    concurrent change answers `412 version_mismatch` instead of being overwritten.
  tags: [organisations]
  security:
    - session: []
      csrf: []
  parameters:
    - name: If-Match
      in: header
      required: false
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateOrganisationRequest.yaml
  responses:
    '200':
      description: Updated.
      headers:
        ETag:
          description: The new profile version.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Organisation.yaml
    4XX:
      $ref: ../components/responses/Problem.yaml
    5XX:
      $ref: ../components/responses/Problem.yaml
