post:
  operationId: forgotPassword
  summary: Request a password reset email
  tags:
  - auth
  security:
  - webClient: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EmailRequest.yaml
  responses:
    '202':
      description: Accepted. The response is the same whether or not the address has an account.
    4XX:
      $ref: ../components/responses/Problem.yaml
    5XX:
      $ref: ../components/responses/Problem.yaml
