parameters:
- $ref: ../components/parameters/OrgId.yaml
- name: spaceId
  in: path
  required: true
  schema:
    $ref: ../components/schemas/Id.yaml
- name: channelId
  in: path
  required: true
  schema:
    $ref: ../components/schemas/Id.yaml
get:
  operationId: listChannelMembers
  summary: listChannelMembers
  tags:
  - channels
  security:
  - session: []
  responses:
    '200':
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ChannelMemberList.yaml
    4XX:
      $ref: ../components/responses/Problem.yaml
    5XX:
      $ref: ../components/responses/Problem.yaml
post:
  operationId: addChannelMember
  summary: addChannelMember
  tags:
  - channels
  security:
  - session: []
    csrf: []
  responses:
    '204':
      description: Completed.
    4XX:
      $ref: ../components/responses/Problem.yaml
    5XX:
      $ref: ../components/responses/Problem.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AddChannelMemberRequest.yaml
