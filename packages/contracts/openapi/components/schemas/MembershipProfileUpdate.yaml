type: object
description: |
  JSON Merge Patch of the caller's own membership. Role, status and organisation cannot be
  changed here (unknown fields are rejected).
additionalProperties: false
properties:
  title:
    type: [string, 'null']
    maxLength: 100
    description: Job title shown to co-members; null or empty clears it.
  contact_email:
    type: string
    maxLength: 254
    description: Must be one of the caller's confirmed email addresses.
