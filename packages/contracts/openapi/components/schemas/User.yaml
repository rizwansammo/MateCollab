type: object
description: The signed-in user's global profile (shared by every organisation they belong to).
additionalProperties: false
required: [id, display_name, timezone, locale, primary_email, deletion_scheduled_at]
properties:
  id:
    $ref: ./Id.yaml
  display_name:
    type: string
    minLength: 1
    maxLength: 80
  timezone:
    type: string
    description: IANA time zone name.
    examples: [Asia/Dhaka]
  locale:
    type: string
    examples: [en-GB]
  primary_email:
    type: string
    maxLength: 254
  deletion_scheduled_at:
    $ref: ./NullableTimestamp.yaml
    description: When a pending account deletion takes effect; null when none is pending.
