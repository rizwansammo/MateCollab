type: object
description: |
  The organisation and role always come from the stored invitation; they cannot be supplied.
  `display_name` and `password` are required only when a new account is created.
additionalProperties: false
required: [token]
properties:
  token:
    type: string
    maxLength: 128
  display_name:
    type: string
    maxLength: 80
  password:
    type: string
    maxLength: 1024
