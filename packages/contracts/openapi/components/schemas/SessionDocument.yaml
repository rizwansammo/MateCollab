type: object
description: Everything the web client needs at start-up. Never contains the session token.
additionalProperties: false
required: [user, csrf_token, session, mfa, organisations]
properties:
  user:
    $ref: ./User.yaml
  csrf_token:
    type: string
    description: Send as `X-CSRF-Token` on every POST, PUT, PATCH and DELETE.
  session:
    type: object
    additionalProperties: false
    required: [id, amr, created_at, expires_at, idle_expires_at, reauthenticated_at]
    properties:
      id:
        $ref: ./Id.yaml
      amr:
        type: array
        description: Authentication methods used, e.g. `pwd`, `totp`, `recovery`.
        items:
          type: string
      created_at:
        $ref: ./Timestamp.yaml
      expires_at:
        $ref: ./Timestamp.yaml
      idle_expires_at:
        $ref: ./Timestamp.yaml
      reauthenticated_at:
        $ref: ./Timestamp.yaml
  mfa:
    type: object
    additionalProperties: false
    required: [totp_enabled]
    properties:
      totp_enabled:
        type: boolean
  organisations:
    type: array
    items:
      $ref: ./OrganisationSummary.yaml
