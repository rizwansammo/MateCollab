openapi: 3.1.1
info:
  title: MateCollab API
  version: 0.1.0
  summary: Same-origin REST API for the MateCollab web client.
  description: |
    Conventions (naming, pagination, errors, idempotency, rate limits) are defined in
    docs/api/API-DESIGN.md. This document is the source of truth for request and response
    shapes: TypeScript types are generated from it and the Go handlers are tested against it.

    Within `/api/v1` changes are additive only. Clients must tolerate unknown fields and
    unknown enum values.

    Tenant resources live under `/orgs/{orgId}`. The caller's membership is resolved before
    any handler runs; organisations the caller does not belong to (and resources of other
    organisations) answer `404`, never `403`.
  license:
    name: Proprietary
    identifier: LicenseRef-NetaMate-Proprietary
servers:
  - url: /api/v1
    description: Same origin as the web application
tags:
  - name: platform
    description: Deployment metadata and runtime client configuration.
  - name: auth
    description: Sign-in, sessions, password recovery, email verification and two-step verification.
  - name: account
    description: The signed-in user's global profile, email addresses and preferences.
  - name: organisations
    description: Organisations, the organisation switcher and organisation settings.
  - name: members
    description: The member directory, roles and membership status.
  - name: invitations
    description: Invitations by email, from creation to acceptance.
  - name: audit
    description: The organisation audit log and its CSV exports.
  - name: spaces
    description: Organisation Spaces, members and Space lifecycle.
  - name: channels
    description: Channels are conversation resources scoped to a Space.
