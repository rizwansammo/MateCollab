packages:
  - apps/*
  - packages/*

# Supply-chain policy (SECURITY-BASELINE.md §18): never install a version published less than
# seven days ago, and only let explicitly approved packages run install scripts.
minimumReleaseAge: 10080
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true

# openapi-typescript 7 declares typescript ^5 but only uses the stable compiler factory API;
# generation is verified under TypeScript 6 by `pnpm contracts:check`.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"

# GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, no patched release published): @next/eslint-plugin-next
# pins fast-glob 3.3.1 → micromatch → braces, and only calls fast-glob's globSync(dir,
# { onlyDirectories }) when `settings.next.rootDir` is set. tinyglobby provides the same
# globSync API without braces; it is already used by Vite and Storybook.
overrides:
  "@next/eslint-plugin-next>fast-glob": npm:tinyglobby@^0.2.17
  "jsdom>undici": ^8.12.4
  "eslint-plugin-react-hooks>zod": ^4.6.7
  "zod-validation-error>zod": ^4.6.7

